title: PCjs Machines
domain: pcjs.org
tagline: Home of the original IBM PC emulator for browsers.
description: >
  PCjs offers a variety of online machine emulators written in JavaScript. Run DOS, Windows, OS/2 and other vintage PC
  applications in a web browser on your desktop computer, iPhone, or iPad. An assortment of microcomputers, minicomputers, terminals,
  programmable calculators, and arcade machines are also available, along with an archive of historical software and documentation.
author: Jeff Parsons
author_url: https://github.com/jeffpar
logo: /assets/img/logo-home.png
data_dir: machines
left_brace: "{"
right_brace: "}"
encoding: UTF-8

exclude:
  - Dockerfile
  - docker-compose.yml
  - docker-init.sh
  - Gemfile
  - Gemfile.lock
  - gulpfile.js
  - README.md
  - "*.log"
  - "**/tmp"
  - "**/archive"
  - "**/private"
  - /package*.json
  - /.history
  - /.vscode
  - /disks
  - /node_modules
  - /software/pcx86/sys/dos/microsoft/1.25/src
  - /software/pcx86/sys/dos/microsoft/2.11/src
  - /tools/pc/disks

github:
  owner_name: "jeffpar"
  owner_url: https://github.com/jeffpar
  repository_url: https://github.com/jeffpar/pcjs
  pages: https://github.com/jeffpar/pcjs/tree/gh-pages

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
#   disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-include-cache

software:
  # vaxdisks: pcjsvax-6e1 -- media for the VAX/VMS demo (pcjsvax-545), following the SAME
  # class-name-per-subdomain convention as decdisks/diskettes/etc below.  We do not own a
  # *.pcjs.org subdomain, so the class name is a path prefix on our own CloudFront distribution
  # instead; downstream path construction (<server>/<file>) is unchanged.
  #
  # The media CANNOT live in this repo: the VMS 5.5 system disk is 159,334,400 bytes and GitHub
  # hard-rejects any file over 100 MB.  Backed by S3 + CloudFront in AWS account 939005125687
  # (provisioned by 3dl-dev/3dl-infra-aws#16 and #17; tenant Terraform in pcjs-vax/terraform/),
  # serving the images RAW -- no gzip, no JSON conversion.  CORS is set on the distribution
  # because this page is served from a different origin than the media, and ACAO alone is not
  # enough: Content-Range must also appear in Access-Control-Expose-Headers, or a ranged read
  # succeeds while the browser cannot see the range metadata -- which fails like disk corruption
  # rather than like a CORS error.
  vaxdisks:
    server: https://do6xafl18swnu.cloudfront.net/vaxdisks
  decdisks:
    server: https://decdisks.pcjs.org
  diskettes:
    server: https://diskettes.pcjs.org
  gamedisks:
    server: https://gamedisks.pcjs.org
  harddisks:
    server: https://harddisks.pcjs.org
  miscdisks:
    server: https://miscdisks.pcjs.org
  pcsigdisks:
    server: https://pcsigdisks.pcjs.org

archive:
  lcm:
    server: https://lcm.pcjs.org
  ms:
    server: https://msarchive.pcjs.org
  kb:
    server: https://jeffpar.github.io/kbarchive
